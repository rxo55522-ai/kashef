<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#E9EEF0;--sheet:#FBFCFC;--ink:#14303F;--muted:#55707D;--line:#C3D0D6;--plan:#1F6E8C;--mark:#FFE27A;--ok:#2B6A4F;--bad:#A3302A;--badbg:#F8E7E5}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);padding:.55rem .7rem;border-radius:3px}
textarea{resize:vertical;line-height:1.8}
label{display:block;font-weight:500;margin-bottom:.25rem}
:focus-visible{outline:3px solid var(--plan);outline-offset:2px}
.btn{background:var(--ink);color:#fff;border:0;padding:.6rem 1.3rem;border-radius:3px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{background:var(--plan)}
.btn[disabled]{opacity:.5;cursor:wait}
.btn.quiet{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn.quiet:hover{background:#fff}
.err{background:var(--badbg);color:var(--bad);padding:.6rem .8rem;border-right:4px solid var(--bad)}
</style>
