<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كاشف</title>
{% include "_style.html" %}
<style>
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1.5rem;background:var(--ink);color:#fff}
.top h1{font-family:Amiri,serif;font-size:1.8rem;line-height:1}
.top nav{display:flex;gap:.4rem;align-items:center}
.top button{white-space:nowrap;background:none;border:0;color:#fff;padding:.3rem .8rem;cursor:pointer;border-radius:3px}
.top button.on{background:#ffffff26}
.demo{background:var(--mark);padding:.5rem 1.5rem;font-weight:500}
.wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:2rem;max-width:1240px;margin:0 auto;padding:1.5rem}
.rail{position:sticky;top:1rem;align-self:start;list-style:none;margin:0;padding:0;border-right:2px solid var(--line)}
.rail button{all:unset;display:block;cursor:pointer;padding:.55rem 1rem;margin-right:-2px;border-right:2px solid transparent;color:var(--muted);width:100%;box-sizing:border-box}
.rail button:focus-visible{outline:3px solid var(--plan)}
.rail button[disabled]{cursor:not-allowed;opacity:.55}
.rail button.on{border-right-color:var(--plan);color:var(--ink);font-weight:700}
.rail span{font-family:Amiri,serif;font-size:1.25rem;margin-left:.5rem}
.sheet{background:var(--sheet);padding:2rem;box-shadow:0 1px 0 var(--line)}
.sheet h2{font-family:Amiri,serif;font-size:1.9rem;margin-bottom:.3rem}
.lead{color:var(--muted);margin-bottom:1.3rem;max-width:68ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-top:1.2rem}
.count{color:var(--muted);font-size:.85rem}
.verdict{display:flex;gap:1.5rem;align-items:baseline;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid var(--line);margin-bottom:1rem}
.verdict b{font-family:Amiri,serif;font-size:3.6rem;line-height:1}
.doc{font-family:Amiri,"Times New Roman",serif;font-size:1.2rem;line-height:2;white-space:pre-wrap;max-width:75ch;unicode-bidi:plaintext}
mark{background:var(--mark);color:inherit}
.why{margin-top:1.2rem;max-width:75ch}.why h3{font-size:1.05rem}.why li{font-size:.92rem;margin-bottom:.3rem}
.compare{display:flex;gap:1.5rem;align-items:baseline;margin-bottom:1rem;flex-wrap:wrap}.compare b{font-family:Amiri,serif;font-size:2rem}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:2rem}
.errors h3{font-size:1.05rem;margin-bottom:.6rem}
.errors .f{margin-bottom:.6rem}
.issue{border-top:1px solid var(--line);padding:.6rem 0;font-size:.92rem}
.issue q{display:block;color:var(--muted);quotes:"«" "»"}
.issue button{background:none;border:0;color:var(--bad);cursor:pointer;padding:0;font-size:.85rem;text-decoration:underline}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem 0;font-weight:400}
.opt input{width:auto;margin-top:.45rem}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.cmp .doc{background:#fff;border:1px solid var(--line);padding:.8rem;max-height:60vh;overflow:auto;font-size:1.05rem}
.cmp textarea{height:60vh;font-family:Amiri,serif;font-size:1.05rem;unicode-bidi:plaintext}
.warn{background:#FFF6D6;padding:.6rem .8rem;border-right:4px solid #B98900;margin-bottom:1rem}
.saved{background:#E2F0E9;border-right:4px solid var(--ok);padding:.8rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-weight:500;color:var(--muted);border-bottom:2px solid var(--ink)}
th,td{padding:.5rem .4rem}
td{border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}tbody tr:hover{background:#fff}
.err{margin-bottom:1rem}
[hidden]{display:none!important}
.tscroll{overflow-x:auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:16px;gap:1rem}.rail{position:static;display:flex;overflow-x:auto;border-right:0;border-bottom:2px solid var(--line)}.rail button{white-space:nowrap;border:0;margin:0;padding:.4rem .7rem}.rail button.on{border-bottom:2px solid var(--plan)}.sheet{padding:1.1rem}.grid2,.split,.cmp{grid-template-columns:1fr}.top{padding:.6rem 16px}}
@media(prefers-reduced-motion:no-preference){.sheet{transition:none}}
</style></head><body>
<header class="top"><h1>كاشف</h1><nav><button id="navNew" class="on">مراجعة جديدة</button><button id="navLog">السجل</button>
<form method="post" action="/logout"><button>خروج</button></form></nav></header>
{% if demo %}<p class="demo">وضع تجريبي: النتائج غير حقيقية وإعادة الصياغة لا تغيّر النص. أضف GEMINI_API_KEY في ملف .env للتشغيل الفعلي.</p>{% endif %}
<div class="wrap"><ol class="rail" id="rail"></ol><main class="sheet" id="main" aria-live="polite"></main></div>
<script>
const RTL_STEPS=['الفحص','مراجعة الأخطاء','إعادة الصياغة','الاعتماد والحفظ'];
const main=document.getElementById('main'),rail=document.getElementById('rail');
let draftFinal=null,review=null,step=0,error='',info='',draft={employee:'',title:'',text:''};
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k.startsWith('on'))e[k]=v;else if(k==='value')e.value=v;else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}e.append(...kids.flat().filter(x=>x!=null&&x!==false));return e}
async function api(url,opts={}){const r=await fetch(url,opts);const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json():{};if(r.status===401){location='/login';throw new Error('')}if(!r.ok)throw new Error(d.error||'تعذّر تنفيذ الطلب.');return d}
const post=(u,b,m='POST')=>api(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function busy(btn,label,fn){const old=btn.textContent;btn.disabled=true;btn.textContent=label;error='';try{await fn()}catch(e){error=e.message;render()}finally{btn.disabled=false;btn.textContent=old}}
function errBox(){return error?h('p',{class:'err',role:'alert'},error):null}
function renderRail(){rail.replaceChildren(...RTL_STEPS.map((s,i)=>h('li',{},h('button',{class:i===step?'on':'',disabled:i>0&&!review,onclick(){step=i;error='';info='';render()}},h('span',{},String(i+1)),s))))}
function render(){renderRail();main.replaceChildren(...[viewScan,viewReview,viewRewrite,viewFinal][step]().filter(Boolean));window.scrollTo({top:0})}

function viewScan(){
 const count=h('span',{class:'count'},`${draft.text.length} حرف`);
 const f=(id,label,key)=>h('div',{},h('label',{for:id},label),h('input',{id,value:draft[key],oninput(e){draft[key]=e.target.value}}));
 const ta=h('textarea',{id:'t',rows:12,dir:'auto',value:draft.text,placeholder:'الصق النص هنا، عربيًا أو إنجليزيًا',oninput(e){draft.text=e.target.value;count.textContent=`${draft.text.length} حرف`}});
 const file=h('input',{type:'file',id:'file',accept:'.docx,.pdf,.txt',async onchange(e){if(!e.target.files[0])return;const fd=new FormData();fd.append('file',e.target.files[0]);error='';info='';try{const d=await api('/api/extract',{method:'POST',body:fd});draft.text=d.text;draft.title=draft.title||d.title;info=d.warning||''}catch(x){error=x.message}render()}});
 const btn=h('button',{class:'btn',onclick(){busy(btn,'جارٍ الفحص…',async()=>{review=await post('/api/reviews',draft);draft={employee:'',title:'',text:''};step=1;info='';render()})}},'افحص النص');
 return [h('h2',{},'مراجعة جديدة'),h('p',{class:'lead'},'ارفع البحث أو التقرير، أو الصق نصه. يُرسل النص إلى Gemini، وقد تستخدمه Google لتطوير منتجاتها، فلا ترفع مستندات سرية.'),errBox(),info?h('p',{class:'warn'},info):null,
 h('div',{class:'grid2'},f('e','اسم الموظف','employee'),f('ti','عنوان المستند','title')),
 h('div',{style:'margin-bottom:1rem'},h('label',{for:'file'},'ملف Word أو PDF أو TXT'),file),
 h('label',{for:'t'},'النص'),ta,h('div',{class:'actions'},btn,count)]
}
function band(s){return s<.2?'مؤشر منخفض':s<.6?'مؤشر متوسط: يحتاج مراجعة':'مؤشر مرتفع: يحتاج مراجعة'}
function highlighted(){const t=review.original_text,out=[];let p=0;for(const[s,e]of review.ranges){if(s>p)out.push(t.slice(p,s));out.push(h('mark',{},t.slice(s,e)));p=e}out.push(t.slice(p));return out}
function viewReview(){
 let excerpt='';
 const doc=h('div',{class:'doc',dir:'auto',onmouseup(){const s=String(getSelection()).trim();if(s){excerpt=s;ex.value=s}}},highlighted());
 const ex=h('textarea',{id:'ex',rows:2,dir:'auto',placeholder:'حدد جملة من النص أو اكتبها هنا'});
 const kind=h('select',{id:'k'},['معلومة خاطئة','مرجع غير موجود','رقم أو تاريخ خاطئ','محتوى لا يخص الجهة','خطأ لغوي','أخرى'].map(k=>h('option',{},k)));
 const note=h('textarea',{id:'n',rows:3,dir:'auto'});
 const add=h('button',{class:'btn',onclick(){busy(add,'جارٍ الحفظ…',async()=>{review=await post(`/api/reviews/${review.id}/issues`,{kind:kind.value,excerpt:ex.value,note:note.value});render()})}},'سجّل الخطأ');
 const issues=review.issues.map(i=>h('div',{class:'issue'},h('strong',{},i.kind),i.excerpt?h('q',{dir:'auto'},i.excerpt):null,h('div',{dir:'auto'},i.note),h('button',{async onclick(){review=await api(`/api/reviews/${review.id}/issues/${i.id}`,{method:'DELETE'});render()}},'احذف')));
 return [h('h2',{},review.title),h('p',{class:'lead'},`${review.employee}، ${review.created_at}`),errBox(),
 review.demo?h('p',{class:'warn'},'هذه النتيجة تجريبية وليست فحصًا حقيقيًا.'):null,
 h('div',{class:'verdict'},h('b',{},`${Math.round(review.ai_score*100)}%`),h('div',{},h('div',{},band(review.ai_score)),h('div',{class:'count'},'نسبة تقديرية، وليست دليلًا. الأصفر هو المقاطع المشتبه بها.'))),
 h('div',{class:'split'},h('div',{},doc,review.reasons.length?h('div',{class:'why'},h('h3',{},'لماذا اشتُبه بهذه المقاطع؟'),h('ul',{},review.reasons.map(r=>h('li',{dir:'auto'},`${r.score}%: ${r.reason}`)))):null),h('aside',{class:'errors'},h('h3',{},`الأخطاء الموثقة (${review.issues.length})`),
  h('div',{class:'f'},h('label',{for:'k'},'النوع'),kind),h('div',{class:'f'},h('label',{for:'ex'},'الجملة'),ex),h('div',{class:'f'},h('label',{for:'n'},'وصف الخطأ'),note),add,issues)),
 h('div',{class:'actions'},h('button',{class:'btn',onclick(){step=2;render()}},'تابع إلى إعادة الصياغة'))]
}
function viewRewrite(){
 const hasFlags=review.ranges.length>0;
 const radio=(v,t,d,c)=>h('label',{class:'opt'},h('input',{type:'radio',name:'scope',value:v,checked:c}),h('span',{},h('strong',{},t),h('br'),d));
 const box=h('div',{},radio('flagged','الفقرات المشتبه بها فقط','تبقى بقية الفقرات كما كتبها الموظف.',hasFlags),radio('all','النص كله','أنسب إذا كان النص كله بأسلوب واحد.',!hasFlags));
 const btn=h('button',{class:'btn',onclick(){const scope=box.querySelector('input:checked').value;busy(btn,'جارٍ إعادة الصياغة…',async()=>{review=await post(`/api/reviews/${review.id}/humanize`,{scope});draftFinal=null;step=3;render()})}},review.rewritten_text?'أعد الصياغة مرة أخرى':'أعد صياغة النص');
 return [h('h2',{},'إعادة الصياغة'),h('p',{class:'lead'},'تتغير الصياغة فقط: لا تُصحَّح المعلومات، وتبقى الأرقام والأسماء والمراجع كما هي. صحّح الأخطاء الموثقة في الخطوة التالية.'),errBox(),box,h('div',{class:'actions'},btn,
 review.rewritten_text?h('button',{class:'btn quiet',onclick(){step=3;render()}},'افتح النص المعاد صياغته'):h('button',{class:'btn quiet',onclick(){review.rewritten_text=review.original_text;step=3;render()}},'تخطَّ واحفظ النص دون صياغة'))]
}
function viewFinal(){
 if(!review.rewritten_text&&!review.final_text)return [h('h2',{},'الاعتماد والحفظ'),h('p',{class:'lead'},'أعد صياغة النص أولًا.'),h('button',{class:'btn',onclick(){step=2;render()}},'ارجع إلى إعادة الصياغة')];
 const ta=h('textarea',{id:'fin',dir:'auto',value:draftFinal??review.final_text??review.rewritten_text,oninput(e){draftFinal=e.target.value}});
 const scanBtn=h('button',{class:'btn quiet',onclick(){busy(scanBtn,'جارٍ الفحص…',async()=>{draftFinal=ta.value;review=await post(`/api/reviews/${review.id}/rescan`,{text:ta.value});render()})}},'افحص النص الجديد');
 const btn=h('button',{class:'btn',onclick(){busy(btn,'جارٍ الحفظ…',async()=>{review=await post(`/api/reviews/${review.id}/final`,{text:ta.value},'PUT');draftFinal=null;render()})}},'اعتمد واحفظ النص');
 const saved=review.status==='approved';
 return [h('h2',{},'الاعتماد والحفظ'),h('p',{class:'lead'},'قارن النصين وعدّل ما تريد في النص الجديد قبل الاعتماد. تبقى النسخة الأصلية محفوظة دون تغيير.'),errBox(),
 saved?h('div',{class:'saved'},`حُفظ النص المعتمد في ${review.approved_at}.`,h('div',{class:'actions'},h('a',{class:'btn',href:`/api/reviews/${review.id}/final.docx`},'نزّل النص بصيغة Word'),h('a',{class:'btn quiet',href:`/api/reviews/${review.id}/report.docx`},'نزّل تقرير الموظف'))):null,
 review.missing.length?h('p',{class:'warn'},`هذه الأرقام أو الروابط لم تعد موجودة كما كانت: ${review.missing.join('، ')}. راجعها قبل الاعتماد.`):null,
 review.new_score!=null?h('div',{class:'compare'},h('span',{},'قبل: ',h('b',{},`${Math.round(review.ai_score*100)}%`)),h('span',{},'بعد: ',h('b',{},`${Math.round(review.new_score*100)}%`)),h('span',{class:'count'},'النسبة تقديرية.')):null,
 h('div',{class:'cmp'},h('div',{},h('label',{},'الأصل'),h('div',{class:'doc',dir:'auto'},review.original_text)),h('div',{},h('label',{for:'fin'},'النص الجديد'),ta)),
 h('div',{class:'actions'},btn,scanBtn)]
}
async function showLog(){
 rail.hidden=true;navLog.className='on';navNew.className='';
 const q=h('input',{placeholder:'ابحث باسم الموظف أو عنوان المستند',oninput(){load(q.value)}});
 const body=h('tbody');
 async function load(v=''){const rows=await api('/api/reviews?q='+encodeURIComponent(v));body.replaceChildren(...rows.map(r=>h('tr',{tabindex:0,onclick:()=>open(r.id),onkeydown:e=>{if(e.key==='Enter')open(r.id)}},h('td',{},r.employee),h('td',{dir:'auto'},r.title),h('td',{},`${Math.round(r.ai_score*100)}%${r.demo?' (تجريبي)':''}`),h('td',{},String(r.issue_count)),h('td',{},r.status==='approved'?'معتمد':'قيد المراجعة'),h('td',{},r.created_at))));if(!rows.length)body.append(h('tr',{},h('td',{colspan:6},'لا توجد مراجعات مطابقة. ابدأ من «مراجعة جديدة».')))}
 main.replaceChildren(h('h2',{style:'margin-bottom:1rem'},'السجل'),q,h('div',{class:'tscroll',style:'margin-top:1rem'},h('table',{},h('thead',{},h('tr',{},['الموظف','المستند','النسبة','الأخطاء','الحالة','التاريخ'].map(t=>h('th',{},t)))),body)));
 await load();
}
async function open(id){draftFinal=null;review=await api('/api/reviews/'+id);newView(1)}
function newView(s){rail.hidden=false;navNew.className='on';navLog.className='';step=s;error='';info='';render()}
const navNew=document.getElementById('navNew'),navLog=document.getElementById('navLog');
navNew.onclick=()=>{review=null;draftFinal=null;newView(0)};navLog.onclick=showLog;
render();
</script></body></html>
